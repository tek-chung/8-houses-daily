name: Weekly freshness check

# Spec §11.1. Sunday 04:00 UTC. Thirty-four pages, one request per second.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated org ids (blank = all)"
        required: false
        default: ""
      dry_run:
        description: "Check source pages without AI calls or file writes"
        type: boolean
        default: false
      census_only:
        description: "Scrapability census only — no model calls, no API key needed"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      # The Python suite cannot execute the page's JavaScript. Two serious bugs
      # hid behind each other in that blind spot, so jsdom runs the built pages.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund

      # The gate decides what reaches visitors unreviewed. If its tests don't
      # pass, we do not run the pipeline at all.
      - name: Test the gate, content isolation and site build
        run: |
          python -m pytest pipeline/ site/ -q
          node site/js/discovery-test.js
          node site/js/directory-test.js
          node site/js/sharing-test.js
        working-directory: .
        env:
          PYTHONPATH: pipeline

      # Answers "can we read these pages?" without spending anything or making
      # any claims. Run this before the first real extraction.
      - name: Scrapability census
        if: inputs.census_only == true
        env:
          PYTHONPATH: pipeline
        run: |
          python pipeline/census.py
          cat docs/census.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the census
        if: inputs.census_only == true
        run: |
          git config user.name  "freshness-bot"
          git config user.email "freshness-bot@users.noreply.github.com"
          git add docs/census.md pipeline/state/census.json
          git diff --cached --quiet || {
            git commit -m "Scrapability census"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"; }

      - name: Run the check
        if: inputs.census_only != true
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS || 'gemini' }}
          AI_GEMINI_MODELS: ${{ vars.AI_GEMINI_MODELS || 'gemini-3.5-flash-lite,gemini-flash-lite-latest' }}
          AI_MAX_INPUT_BYTES: ${{ vars.AI_MAX_INPUT_BYTES || '262144' }}
          AI_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.AI_GEMINI_FREE_TIER_CONFIRMED || 'false' }}
          AI_GEMINI_DAILY_CALLS: ${{ vars.AI_GEMINI_DAILY_CALLS || '20' }}
          AI_GEMINI_MIN_INTERVAL_MS: ${{ vars.AI_GEMINI_MIN_INTERVAL_MS || '5000' }}
          AI_OPENROUTER_MODELS: ${{ vars.AI_OPENROUTER_MODELS }}
          AI_OPENROUTER_FREE_TIER_CONFIRMED: ${{ vars.AI_OPENROUTER_FREE_TIER_CONFIRMED || 'false' }}
          AI_OPENROUTER_DAILY_CALLS: ${{ vars.AI_OPENROUTER_DAILY_CALLS || '20' }}
          AI_MAX_RUN_CALLS: ${{ vars.AI_MAX_RUN_CALLS || '20' }}
          AI_DAILY_USD: '0'
          AI_LEDGER_GIT_SYNC: 'true'
          PYTHONPATH: pipeline
          CHECK_ONLY_ORGS: ${{ inputs.only }}
          CHECK_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          args=(--only "$CHECK_ONLY_ORGS")
          if [ "$CHECK_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python pipeline/run.py "${args[@]}" 2>&1 | tee run.log
          statuses=("${PIPESTATUS[@]}")
          code=${statuses[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "${statuses[1]}" -ne 0 ] || { [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; }; then
            echo "::error::Refresh failed to run. See run.log in the uploaded artifact."
            exit 1
          fi
          if [ "$CHECK_DRY_RUN" != "true" ]; then
            python -c "import json; r=json.load(open('pipeline/state/review.json', encoding='utf-8')); assert isinstance(r['items'], list) and r['needs_review'] == len(r['items'])"
          fi
          if [ "$CHECK_DRY_RUN" != "true" ]; then
            python pipeline/report.py summary >> "$GITHUB_STEP_SUMMARY"
            python pipeline/report.py outputs >> "$GITHUB_OUTPUT"
            if ! python -c "import json,sys; r=json.load(open('pipeline/state/review.json', encoding='utf-8')); sys.exit(0 if r['extraction_available'] else 1)"; then
              echo "::warning::No enabled AI provider. Check the API secret, model list and free-tier confirmation. Changed pages require review."
            fi
          fi

      # Auto-published changes: committed straight to main. These are non-critical
      # fields only, at or above the confidence threshold. Spec §11.3.
      - name: Commit auto-published changes
        if: inputs.census_only != true && inputs.dry_run != true
        run: |
          git config user.name  "freshness-bot"
          git config user.email "freshness-bot@users.noreply.github.com"
          git add data/
          if [ -f pipeline/state/http_cache.json ]; then git add pipeline/state/http_cache.json; fi
          if git diff --cached --quiet; then
            echo "No auto-publishable changes."
          else
            git commit -m "Weekly freshness check: auto-published changes"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # Anything the gate held back becomes a PR. Uses the preinstalled gh CLI
      # rather than a third-party action, so there's no supply chain to pin.
      - name: Open a review PR
        if: inputs.census_only != true && steps.run.outputs.review_count != '' && steps.run.outputs.review_count != '0' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="freshness/review-$(date +%Y-%m-%d)"
          git checkout -B "$BRANCH"
          git add -f pipeline/state/review.json
          git commit -m "Freshness check: items needing review" || true
          git push -f -u origin "$BRANCH"

          python pipeline/report.py pr > body.md

          if ! gh pr create --title "Freshness review — $(date '+%d %b %Y')" \
               --body-file body.md --base "${{ github.ref_name }}" --head "$BRANCH"; then
            if ! gh pr edit "$BRANCH" --body-file body.md; then
              echo "::warning::Review PR could not be created or updated. The review report is available in the freshness-run artifact. Check repository Actions PR permissions."
              cat body.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freshness-run
          path: |
            run.log
            pipeline/state/review.json
            pipeline/state/ai_usage.json
          retention-days: 30

      - name: Flag incomplete source or AI checks
        if: inputs.census_only != true && inputs.dry_run != true && steps.run.outputs.failed_count != '' && steps.run.outputs.failed_count != '0'
        run: |
          echo "::error::Refresh is incomplete. See provider diagnostics and failed checks in the job summary. Existing listings were retained."
          exit 1
