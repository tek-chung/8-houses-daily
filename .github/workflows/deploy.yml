name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install validation dependencies
        run: |
          python -m pip install pytest
          npm ci --no-audit --no-fund
      - name: Build
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL repository variable is not set."
            exit 1
          fi
          python site/build.py
      - name: Validate the site and browser interactions
        run: |
          python -m pytest site/ -q
          node site/js/discovery-test.js
          node site/js/directory-test.js
          node site/js/sharing-test.js
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: dist
          retention-days: 7
      - name: Check Cloudflare deployment configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Build validated; automatic deployment not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the CLOUDFLARE_API_TOKEN repository secret and CLOUDFLARE_ACCOUNT_ID repository variable to enable automatic deployment. The production artifact is available; releases currently use the existing local Wrangler workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to Cloudflare
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
